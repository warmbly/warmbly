name: Coolify Compose

on:
  pull_request:
    paths:
      - deploy/docker-compose.coolify.yml
      - deploy/check-coolify.sh
      - .github/workflows/coolify.yml
  push:
    branches: [main]
    paths:
      - deploy/docker-compose.coolify.yml
      - deploy/check-coolify.sh
      - .github/workflows/coolify.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate image-only Coolify stack
        run: bash deploy/check-coolify.sh
