name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default token only gets `contents: read` on PRs from forks; the
# dorny/paths-filter action needs to list PR files via the GitHub
# API, which requires `pull-requests: read`. Without this the
# "Detect Changes" job dies with "Bad credentials" and every
# downstream language CI is skipped.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      go-services: ${{ steps.filter.outputs.go-services }}
      tracking: ${{ steps.filter.outputs.tracking }}
      realtime: ${{ steps.filter.outputs.realtime }}
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
      site: ${{ steps.filter.outputs.site }}
      make: ${{ steps.filter.outputs.make }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go-services:
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'cmd/**'
            tracking:
              - 'tracking/**'
            realtime:
              - 'realtime/**'
              - 'deploy/docker/realtime.Dockerfile'
            web:
              - 'web/**'
            admin:
              - 'admin/**'
            site:
              - 'site/**'
            make:
              - 'integrations/make/**'
            ios:
              - 'ios/**'

  go-ci:
    name: Go CI
    needs: changes
    if: needs.changes.outputs.go-services == 'true'
    runs-on: ubuntu-latest
    # Mailpit for CONFENGE product-acceptance email proof (SMTP + HTTP API).
    services:
      mailpit:
        image: axllent/mailpit:v1.22
        ports:
          - 1025:1025
          - 8025:8025
    env:
      CONFENGE_MAILPIT_SMTP: 127.0.0.1:1025
      CONFENGE_MAILPIT_API: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "33.x"
          repo-token: ${{ github.token }}

      - name: Install required Go tools
        run: make setup-tools

      - name: Run golangci-lint
        run: make lint

      - name: Verify protobuf files are up to date
        run: make check-proto

      - name: Wait for Mailpit
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$CONFENGE_MAILPIT_API/api/v1/info" >/dev/null; then
              echo "mailpit ready"
              exit 0
            fi
            sleep 1
          done
          echo "mailpit did not become ready" >&2
          exit 1

      - name: Run tests with coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          flags: go
          fail_ci_if_error: false

  web-ci:
    name: Web CI
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

  # Real browser CONFENGE product acceptance (not data-testid static presence).
  # Requires full local-like stack; fails closed if healthchecks fail.
  confenge-product-acceptance:
    name: CONFENGE product acceptance
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.go-services == 'true'
    # Hard gate: Playwright FAIL must fail the workflow. Do not re-add continue-on-error.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warmbly
          POSTGRES_PASSWORD: warmbly
          POSTGRES_DB: warmbly_dev
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U warmbly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["16379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # NATS without JetStream panics ensureStream; start -js manually in a step.
      mailpit:
        image: axllent/mailpit:v1.22
        ports:
          - 11025:1025
          - 18025:8025
    env:
      PRIMARY_DB: postgres://warmbly:warmbly@127.0.0.1:15432/warmbly_dev?sslmode=disable
      REDIS: redis://127.0.0.1:16379
      NATS_URL: nats://127.0.0.1:4222
      EVENTBUS_PROVIDER: nats
      CODEC_PROVIDER: json
      APP_ENV: dev
      APP_URL: http://127.0.0.1:5173
      # Use :8080 so default VITE_API_URL and dashboard expectations match.
      API_HOST: 127.0.0.1:8080
      WEBSOCKET_URL: ws://127.0.0.1:4000/socket/websocket
      GEODB_PATH: /tmp/missing-geolite.mmdb
      BILLING_PROVIDER: none
      AWS_CONFIG_ENABLED: "false"
      CAPTCHA_PROVIDER: none
      KMS_PROVIDER: local
      KMS_LOCAL_MASTER_KEY: Xr0JA7gqF2POy29a7MRByyqddivTNt8WOyKsOXklazk=
      CREDENTIALS_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      ENCRYPTED_KEYS_PROVIDER: postgres
      BLOB_PROVIDER: filesystem
      BLOB_FS_ROOT: /tmp/warmbly-blobs
      BLOB_PUBLIC_BASE_URL: http://127.0.0.1:8080/public
      TASKS_PROVIDER: local
      AUTH_SECRET: local-dev-auth-secret-minimum-32-characters-long
      INTERNAL_API_TOKEN: local-dev-internal-token
      EMAIL_NAME: Warmbly Dev
      EMAIL_ADDRESS: dev@warmbly.local
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "11025"
      CONFENGE_LOCAL_SMTP_DELIVERY: "true"
      CONFENGE_SMTP_SINK_EMAIL: confenge-e2e-sink@warmbly.local
      TRACKING_DOMAIN: t.warmbly.com
      CORS_ALLOW_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      CONFENGE_OUTREACH_ENABLED: "true"
      CONFENGE_REQUIRE_HUMAN_APPROVAL: "true"
      CONFENGE_AUTO_SEND_ENABLED: "false"
      CONFENGE_DEFAULT_CAMPAIGN_DAILY_LIMIT: "100"
      CONFENGE_GLOBAL_SENDS_PER_HOUR: "10"
      CONFENGE_MIN_SEND_GAP_SECONDS: "360"
      CONFENGE_E2E: "1"
      CONFENGE_E2E_API: http://127.0.0.1:8080
      CONFENGE_E2E_MAILPIT: http://127.0.0.1:18025
      CONFENGE_E2E_BASE_URL: http://127.0.0.1:5173
      CONFENGE_GATE_CODE_SHA: ${{ github.sha }}
      CONFENGE_E2E_PROOF_DIR: ${{ github.workspace }}/data/confenge-evidence
      # Absolute path: Playwright runs with cwd=web/, so repo-relative paths break.
      # The historical real slice predates authoritative target-fit fields and must fail closed.
      CONFENGE_E2E_FEED: ${{ github.workspace }}/internal/app/confenge/testdata/demo_3_companies.json
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps + Playwright browser
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          npx playwright install --with-deps chromium

      - name: Start NATS JetStream
        run: |
          docker run -d --name confenge-nats -p 4222:4222 -p 8222:8222 \
            nats:2.10-alpine -js -sd /data -m 8222
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8222/healthz >/dev/null 2>&1; then
              echo "nats jetstream up"
              exit 0
            fi
            sleep 1
          done
          echo "nats failed" >&2
          docker logs confenge-nats || true
          exit 1

      - name: Migrate + seed
        run: |
          go run ./cmd/migrate
          SEED_RICH=true SEED_FULL=true go run ./cmd/seed

      - name: Start backend
        run: |
          mkdir -p /tmp/warmbly-blobs data/confenge-evidence
          go build -o /tmp/warmbly-backend ./cmd/backend
          nohup /tmp/warmbly-backend > /tmp/confenge-backend.log 2>&1 &
          echo $! > /tmp/confenge-backend.pid
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/v1/confenge/status || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then
              if kill -0 "$(cat /tmp/confenge-backend.pid)" 2>/dev/null; then
                echo "backend up code=$code"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "backend failed to start" >&2
          tail -100 /tmp/confenge-backend.log || true
          exit 1

      - name: Start web
        working-directory: web
        env:
          VITE_API_URL: http://127.0.0.1:8080
          VITE_APP_URL: http://127.0.0.1:5173
        run: |
          nohup pnpm dev --host 127.0.0.1 --port 5173 > /tmp/confenge-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:5173/; then
              echo "web up"
              exit 0
            fi
            sleep 2
          done
          echo "web failed to start" >&2
          tail -50 /tmp/confenge-web.log || true
          exit 1

      - name: Healthchecks (pre-browser)
        run: |
          curl -fsS http://127.0.0.1:18025/api/v1/info >/dev/null
          curl -fsS -o /dev/null http://127.0.0.1:5173/
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/v1/confenge/status || true)
          test -n "$code" && test "$code" -lt 500
          # Prove confenge feature is enabled on the server for the E2E org path.
          echo "confenge status http=$code"

      - name: Playwright live browser
        working-directory: web
        run: pnpm test:e2e:confenge:live

      - name: Upload playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confenge-playwright-evidence
          path: |
            data/confenge-evidence/
            web/playwright-report/
          if-no-files-found: warn

  admin-ci:
    name: Admin CI
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  site-ci:
    name: Site CI
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # Astro project; build catches type errors, broken imports,
        # missing assets. No separate lint/typecheck script is wired
        # in package.json today.
        run: pnpm build

  make-ci:
    name: Make App CI
    needs: changes
    if: needs.changes.outputs.make == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/make
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Make app
        # IML is interpreted by Make (no compile step); validate.mjs checks the
        # manifest, JSON validity, code-file references, and component enums.
        run: node scripts/validate.mjs

  rust-ci:
    name: Rust CI
    needs: changes
    if: needs.changes.outputs.tracking == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracking
    steps:
      - uses: actions/checkout@v4

      # The default tracking build is NATS-only (pure Rust, rustls TLS), so it
      # needs no librdkafka / libcurl / libsasl system headers. Those are only
      # required for the optional `--features kafka` build.

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tracking

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

  elixir-ci:
    name: Elixir CI
    needs: changes
    if: needs.changes.outputs.realtime == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        # mix.exs requires `elixir: "~> 1.18"`. Bumped here to match.
        # Phoenix 1.8 + plug 1.19 also expect a recent OTP.
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            realtime/deps
            realtime/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('realtime/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo
        # credo isn't in mix.exs yet; skip when the binary isn't
        # available so CI doesn't false-fail. Re-enable once it's
        # added as a dev dep.
        run: mix help credo > /dev/null 2>&1 && mix credo --strict || echo "credo not installed; skipping"

      - name: Compile
        # Don't fail the build on transitive warnings — jose/CAStore
        # and a couple of our own files emit deprecation warnings on
        # Elixir 1.18 that aren't fixable without forking deps.
        # Real compile errors still fail the step.
        run: mix compile

      - name: Run tests
        run: mix test

  ios-ci:
    name: iOS CI
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # macOS minutes are 10x Linux; the paths filter keeps this off
    # non-iOS PRs. The app needs the iOS 26 SDK and the Icon Composer
    # .icon app icon, so it must be a macos-26 image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build (iOS Simulator, no signing)
        # arm64 only: the generic destination otherwise also builds the
        # x86_64 slice, doubling build time for a compile check.
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/Warmbly.xcodeproj \
            -scheme Warmbly \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO

  # Validate the web/admin production Dockerfiles (build + nginx config check)
  # without pushing, so a broken image can't reach a release tag unnoticed. The
  # release workflow is the only other place these build, and only on tags.
  frontend-images:
    name: Frontend Image (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, admin]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=ci-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.service }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [changes, go-ci, web-ci, confenge-product-acceptance, admin-ci, site-ci, make-ci, rust-ci, elixir-ci, ios-ci, frontend-images, security]
    if: always()
    steps:
      - name: Check CI status
        run: |
          # confenge-product-acceptance is a hard gate when it ran. Skipped (path filter)
          # is allowed only when neither web nor go-services changed; otherwise failure,
          # cancelled, or timed_out of that job fails the aggregate.
          confenge_result="${{ needs.confenge-product-acceptance.result }}"
          confenge_failed=0
          if [[ "$confenge_result" == "failure" ]] || \
             [[ "$confenge_result" == "cancelled" ]] || \
             [[ "$confenge_result" == "timed_out" ]]; then
            confenge_failed=1
          fi
          # When web/go changed, job should not be skipped; treat unexpected skip as fail.
          if [[ "${{ needs.changes.outputs.web }}" == "true" ]] || \
             [[ "${{ needs.changes.outputs.go-services }}" == "true" ]]; then
            if [[ "$confenge_result" == "skipped" ]] || [[ -z "$confenge_result" ]]; then
              echo "CONFENGE product acceptance was skipped but web/go changes require it"
              confenge_failed=1
            fi
          fi
          if [[ "${{ needs.go-ci.result }}" == "failure" ]] || \
             [[ "${{ needs.web-ci.result }}" == "failure" ]] || \
             [[ "${{ needs.admin-ci.result }}" == "failure" ]] || \
             [[ "${{ needs.site-ci.result }}" == "failure" ]] || \
             [[ "${{ needs.make-ci.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-images.result }}" == "failure" ]] || \
             [[ "${{ needs.rust-ci.result }}" == "failure" ]] || \
             [[ "${{ needs.elixir-ci.result }}" == "failure" ]] || \
             [[ "${{ needs.ios-ci.result }}" == "failure" ]] || \
             [[ "${{ needs.security.result }}" == "failure" ]] || \
             [[ "$confenge_failed" -eq 1 ]]; then
            echo "CI failed (confenge=$confenge_result)"
            exit 1
          fi
          echo "CI passed (confenge=$confenge_result)"
