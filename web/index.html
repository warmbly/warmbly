<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Warmbly</title>
    <meta name="apple-mobile-web-app-title" content="Warmbly" />
    <!-- Runtime config: the production image overwrites this with values from
         container env so one build serves any deployment. Empty in dev. Loads
         before the app module so window.__WARMBLY_ENV__ is set first. -->
    <script src="/config.js"></script>
    <!-- Theme before first paint, so a dark dashboard never flashes white.
         Same key and rules as src/lib/theme.ts. -->
    <script>
      (function () {
        var dark = false;
        try {
          var t = localStorage.getItem("theme");
          // No choice of the viewer's own: a brand's default, when one was applied here before.
          if (t !== "light" && t !== "dark" && t !== "system") t = localStorage.getItem("theme-default");
          dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {}
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        var meta = document.createElement("meta");
        meta.name = "theme-color";
        meta.content = dark ? "#070708" : "#f5f6f8";
        document.head.appendChild(meta);
      })();
    </script>
    <style>
      /* Paint the dashboard chrome's colour at once and keep #root hidden
         until the stylesheet and the interface font are in effect (main.tsx
         adds .app-ready), so the first visible frame is the finished one. */
      html { background-color: #f5f6f8; }
      html.dark { background-color: #070708; }
      #root { opacity: 0; }
      #root.app-ready { opacity: 1; transition: opacity 120ms ease-out; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
