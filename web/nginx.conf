server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS is available at runtime; variables avoid build-time DNS
    # resolution during `nginx -t` in the image build.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream backend:8080;
    set $realtime_upstream realtime:4000;


    # API routes share the public relay origin with the SPA. The browser app
    # builds requests as https://relay.pattrndata.io/v1/...; without this
    # proxy, nginx's SPA fallback returns index.html for API calls.
    location /v1/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://$backend_upstream;
    }

    location = /health {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$backend_upstream/health;
    }

    location = /worker-install.sh {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$backend_upstream/worker-install.sh;
    }

    location /socket/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://$realtime_upstream;
    }

    # SPA history fallback: unknown paths serve the app shell so client-side
    # routing works on hard reloads and deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the shell or the runtime config, so a redeploy or an env
    # change is picked up on the next load. The hashed assets they point to are
    # cached immutably below.
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /config.js  { add_header Cache-Control "no-store"; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
