<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!-- The Go shell stamps the render token here; empty in `vite dev`. -->
    <meta name="wf-token" content="" />
    <!-- Browser analytics and error reporting, stamped by the Go shell from
         the forms service's WARMBLY_POSTHOG_KEY and WARMBLY_SENTRY_DSN. Empty
         (the default, and always in `vite dev`) means the SDK chunk is never
         even fetched. wf-posthog-errors "false" keeps the key and reports no
         exceptions. -->
    <meta name="wf-posthog-key" content="" />
    <meta name="wf-posthog-host" content="" />
    <meta name="wf-posthog-errors" content="" />
    <meta name="wf-sentry-dsn" content="" />
    <meta name="wf-release" content="" />
    <meta name="wf-environment" content="" />
    <title>Form</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
