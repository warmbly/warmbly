# pnpm 11+ settings live here, not in package.json.
# Trust the install-time native build scripts so `pnpm install` + `next build`
# work without manual approval (adding this file activates pnpm's build gate).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  picomatch: ^4.0.4
  path-to-regexp: ^8.4.0
  # Floor transitive dependencies at their patched releases.
  js-yaml: ^4.3.2
  sharp: ^0.35.5
  # next pins an exact postcss; lift it to the patched line.
  postcss: ^8.5.23
  nanoid: ^3.3.17
  image-size: ^2.0.3
  postcss-selector-parser: '>=7.1.3'
  # fumadocs-mdx pins an older esbuild; lift it to the patched line.
  esbuild: '>=0.28.1'
  dompurify: ^3.4.16
  # Stay before 0.18.11, which upstream deprecated for breaking changes.
  katex: 0.18.2
  source-map-js: ^1.2.2
